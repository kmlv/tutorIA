# Matriz del bake-off M4.
#
# ESTADO: MEDIDA para A y B. C y D se quedan con las estimaciones del reconocimiento y no
# se construyeron como brazos — el razonamiento está en `00-barrido-provisional.md` y
# Kristian puede revocarlo.
#
# Cada celda dice de dónde sale su número. Las de A y B vienen de instrumentos que están
# en `medir/` y se pueden volver a correr; las de C y D, del reconocimiento. Mezclar las
# dos cosas en una tabla sin decirlo sería lo peor que puede hacer este archivo.
#
# Los PESOS están pre-registrados en `docs/M4-PREREGISTRO.md`, en un commit anterior a
# cualquier medición. Las REGLAS DE PUNTUACIÓN de abajo se escribieron después de ver los
# datos, y por eso van con los números crudos al lado: si Kristian puntúa distinto, el
# marcador recalcula sin tocar nada más.

criteria:
  c1:
    nombre: "calidad visual y pedagógica"
    unidad: "1-5"
    higher_is_better: true
  c2:
    nombre: "personalización al vuelo"
    unidad: "0-10"
    higher_is_better: true
  c3:
    nombre: "costo por concepto"
    unidad: "horas"
    higher_is_better: false
  c4:
    nombre: "accesibilidad y mantenibilidad"
    unidad: "0-10"
    higher_is_better: true
  c5:
    nombre: "versatilidad entre equipos"
    unidad: "0-10"
    higher_is_better: true

options:

  # A — audio MP3 + escenario DOM/SVG movido por el cue engine. Lo que ya estaba en
  # producción, más el sondeo con rAF que el propio bake-off obligó a añadir.
  A-dom-svg:
    c1: 4.8           # rúbrica de RUBRICA-C1.md, puntuada en 01-criterio-1.md.
                      # NO fue a ciegas y está dicho allí; Kristian puede repuntuar.
    c2: 9             # medido: 0,15 s desde editar `m` en pack.yaml hasta que el pack
                      # sirve los interceptos nuevos (medir/c2.json)
    c3: 0.5           # guion + marcas de cue + compilar audio
    c4: 9             # medido: el SVG expone un aria-label con ingreso, precios, los dos
                      # interceptos y la pendiente, más 4 nodos de texto seleccionables
                      # (medir/a11y.json). Una errata se arregla editando un .md
    c5: 9             # medido sobre la lección entera a velocidad real: 1,57-1,99 MB por
                      # la red, 0 ms de bloqueo del hilo principal a 1x, 51 ms a 4x, y
                      # desfase de cues p95 85 ms. Ni un fotograma perdido

  # B — Remotion: componentes React renderizados a MP4. Construido y medido dentro de la
  # app real, no como demo aparte: `?variant=B` sirve la lección entera con sus
  # checkpoints, su chat y su práctica.
  B-remotion:
    c1: 3.6           # misma rúbrica, tras corregir tres defectos que eran andamiaje mío
                      # y no de Remotion (ver 01-criterio-1.md)
    c2: 3             # medido: 79,3 s, de los cuales 78,4 son el render. Sube de 2 a 3
                      # respecto del reconocimiento porque la mitad de autoría SÍ está
                      # resuelta: los beats se regeneran solos desde la misma máquina de
                      # estados (0,9 s), sin editar nada
    c3: 1.5           # el componente de Remotion son ~200 líneas y se escribe una vez;
                      # de ahí en adelante es el costo de A más 78 s de render. ESTIMACIÓN
                      # mía del tiempo de autoría, no un cronómetro
    c4: 1             # medido: sin aria-label, 0 nodos de texto en el escenario, 0 pistas
                      # de texto. El gráfico no existe para un lector de pantalla. Y el
                      # MP4 no puede seguir el tema claro/oscuro de la página
    c5: 5             # medido: empata con A en fotogramas y en bloqueo del hilo, y pierde
                      # 10x en bytes — 17,9-22,2 MB contra 1,86. El MP4 pesa 10,5 MB y el
                      # navegador transfiere 1,7-2x eso porque la lección pausa en cada
                      # checkpoint y rebuferea. Si c5 se lee ESTRICTAMENTE como CPU, esto
                      # sería un 8 y el criterio dejaría de discriminar

  # C — Manim. Sin construir: estimaciones del reconocimiento.
  C-manim:
    c1: null
    c2: 1             # el artefacto que un modelo tendría que emitir es Python arbitrario,
                      # donde una llamada mal escrita es un no-op silencioso
    c3: 4
    c4: 2
    c5: 8

  # D — Híbrido. Sin construir: es una técnica de composición, no una tecnología contra la
  # que competir. Se aplica sobre el ganador, después.
  D-hibrido:
    c1: null
    c2: 4
    c3: 2.5
    c4: 5
    c5: 7
