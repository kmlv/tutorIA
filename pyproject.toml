[project]
name = "tutoria"
version = "0.1.0"
description = "PoC de tutor interactivo para microeconomía intermedia"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# El SDK del proveedor es opcional a proposito: sin el, `default_provider()` cae a
# `FakeProvider` y el servidor arranca igual. La leccion no puede depender del juez.
llm = [
    "openai>=2.0",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
