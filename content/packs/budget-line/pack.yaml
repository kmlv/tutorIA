# Manifiesto del concepto: línea presupuestaria
#
# Notación de Kristian (econ100a-slides_homeworks/docs/S2_Budget_Constraint_Ch2.md):
#   x1, x2 = cantidades   ·   p1, p2 = precios   ·   m = ingreso
# Ejemplo del PoC: good 1 = coffee (kg), good 2 = orange juice (L).
#   p1 = 3, p2 = 1, m = 100  =>  pendiente = -3
#
# PROCEDENCIA: los NÚMEROS y la forma de leer la pendiente vienen de S2 de Kristian;
# los BIENES no. Su ejemplo original usaba otro par de bienes y él pidió cambiarlo
# (2026-08-10). Se conserva su lectura de la pendiente —"hay que renunciar a 3 unidades
# del bien 2 para poder comprar 1 unidad más del bien 1"— pero NO se le atribuye como
# cita textual, porque la frase con estos bienes no es suya.

id: budget-line
version: 0.1.0
titulo:
  es: La línea presupuestaria
  en: The Budget Constraint
lang: [en, es]   # en primero: el ingles es la fuente, el espanol la traduccion
media_variant_default: A

# Parámetros del ejemplo, usados por el guión, el gráfico y los ítems numéricos.
# Cambiarlos aquí debe bastar para regenerar todo: es la prueba del criterio 2 del bake-off.
ejemplo:
  bien_1: {es: café, en: coffee}
  bien_2: {es: jugo de naranja, en: orange juice}
  p1: 3
  p2: 1
  m: 100
  # intercepto de x1 = 100/3 ≈ 33.3 — deliberadamente no entero.
  # Es el ejemplo real de Kristian y se conserva; un número redondo escondería que el
  # intercepto se calcula, no se lee del gráfico.

checkpoints:
  - id: cp1
    despues_de_cue: slope
    pregunta_ref: q_cp1_income_direction
  - id: cp2
    despues_de_cue: price_pivot
    pregunta_ref: q_cp2_why_intercept_fixed

# Prediction points. The `<!--cue:predict:X-->` marks in the script pause the media
# BEFORE the narration reveals the answer; this maps each mark to its question.
predictions:
  line_vs_set:  q_predict_line_vs_set
  slope_sign:   q_predict_slope_sign
  price_effect: q_predict_price_effect

sub_skills:
  - id: BL.EQ
    esencial: true
    umbral: 0.80
    titulo:
      es: Plantear p1·x1 + p2·x2 = m e interpretar cada término
      en: State p1·x1 + p2·x2 = m and interpret each term
    # HUECO CONOCIDO: es la única sub-skill sin misconception asociada en
    # misconceptions.yaml. O falta una entrada del catálogo, o esta sub-skill no es
    # diagnosticable por separado y debería fusionarse con BL.INT.
    # No lo resolvemos por intuición: es exactamente el caso que codex describió como
    # "marcar para fusión O rediseño", y se decide con los exámenes de Econ 100A.
    estado: revisar_en_validacion

  - id: BL.INT
    esencial: true
    umbral: 0.80
    titulo:
      es: Interceptos m/p1 y m/p2, cálculo e interpretación
      en: Intercepts m/p1 and m/p2, computation and meaning
    misconceptions: [BL-M6, BL-M3]

  - id: BL.SLOPE
    esencial: true
    umbral: 0.80
    titulo:
      es: Pendiente -p1/p2 como precio relativo y costo de oportunidad
      en: Slope -p1/p2 as relative price and opportunity cost
    misconceptions: [BL-M1, BL-M5, BL-M2]

  - id: BL.FEAS
    esencial: true
    umbral: 0.80
    titulo:
      es: Conjunto presupuestario — interior, frontera y no alcanzable
      en: Budget set — interior, boundary and unaffordable
    misconceptions: [BL-M4, BL-M7]

  - id: BL.CS.M
    esencial: true
    umbral: 0.80
    titulo:
      es: Cambio en m ⇒ desplazamiento paralelo
      en: Change in m ⇒ parallel shift
    misconceptions: [BL-M2]

  - id: BL.CS.P
    esencial: true
    umbral: 0.80
    titulo:
      es: Cambio en p1 o p2 ⇒ pivote sobre el intercepto del otro bien
      en: Change in p1 or p2 ⇒ pivot around the other good's intercept
    misconceptions: [BL-M3]

# Criterio de dominio (PLAN §3.2, actualizado con los hallazgos de T-002).
dominio:
  p_mastery_min: 0.80
  aciertos_consecutivos: 3
  modalidades_min: 2
  sin_andamiaje_min: 1      # al menos un acierto sin pista, sin feedback previo del juez
                            # y sin ayuda sobre el gráfico, en ese turno
  max_evidencias_del_juez_llm: 1   # las otras 2 vienen de graders deterministas
  sin_misconception_activa: true

salidas:
  # Reemplazan al antiguo `stuck := attempts >= 6`, que codex demostró que era un
  # marcador de posición presentado como decisión.
  stop_rule_version: "0.1.0"
  estados:
    - id: provisional_mastery
      cuando: evidencia independiente pero incompleta
    - id: budget_exhausted
      cuando: se agotó el tope de preguntas de la actividad
    - id: indeterminate
      cuando: no hubo evidencia suficiente para afirmar ni negar

# ---------------------------------------------------------------------------
# Mapeo contra IESA-Micro (Cornell Suite) — hallazgo de T-002.
# https://www.econ-assessments.org/pages/IESA-Micro.html
#
# Su sección III "The Consumer's Problem" tiene 22 learning goals. El bloque A.Budgets
# (3 goals) es el que cubre este concepto. PENDIENTE de precisar contra el documento
# real: Kristian tiene que pedirlo por formulario, y hasta que llegue este mapeo se
# apoya en el resumen de la investigación, no en la fuente.
# ---------------------------------------------------------------------------
iesa_micro:
  estado: pendiente_de_obtener_el_cuestionario
  seccion: "III — The Consumer's Problem"
  bloque: "A. Budgets (3 learning goals)"
  cobertura_declarada:
    - goal: conjunto presupuestario y cómo cambia
      cubierto_por: [BL.FEAS, BL.CS.M, BL.CS.P]
    - goal: pendiente como costo de oportunidad
      cubierto_por: [BL.SLOPE]
    - goal: budget sets a partir de dotaciones
      cubierto_por: []
      excluido_a_proposito: true
      razon: >
        Las dotaciones (endowments) quedan fuera del alcance del PoC. Se registra aquí
        para que el hueco sea deliberado y no un descuido, que es justo lo que el
        hallazgo H-C3 de T-002 pedía.
  fuera_de_alcance_del_poc:
    - Slutsky y descomposición de efectos
    - demanda Hicksiana vs Marshalliana
    - soluciones de esquina
    - transformaciones monótonas de la utilidad
    - bienes Giffen e inferiores

# ---------------------------------------------------------------------------
# On-screen notes. Each cue may put one line of text and one formula on the page,
# so the student reads the concept as well as hearing it and seeing the graph.
# Minimal but complete: one idea per cue, never a wall of text.
#
# Formulas are TeX and are rendered to static HTML at BUILD time (C3), so the
# runtime ships no KaTeX JavaScript.
# ---------------------------------------------------------------------------
notes:
  consumo:
    en: A consumer chooses a *combination* of goods, not one good. What limits it is resources, not desire.
    es: El consumidor elige una *combinación* de bienes, no un bien. Lo que la limita son los recursos, no el deseo.
  canasta:
    en: A bundle with two goods is a pair of numbers.
    es: Una canasta de dos bienes es un par de números.
    formula: '(x_1,\, x_2)'
  espacio:
    en: Each good is an axis, so every bundle is a point on the plane.
    es: Cada bien es un eje, así que cada canasta es un punto del plano.
    formula: 'x_1 \ge 0,\quad x_2 \ge 0'
  budget_set:
    en: Affordable bundles — the budget set.
    es: Canastas alcanzables — el conjunto presupuestario.
    # Dimensional form FIRST (codex, T-010): the units live inside the equation, not
    # beside it, which is what Kristian asked for. The compact form follows.
    formula_dim: '3\,\tfrac{\$}{kg} \cdot x_1\,kg \;+\; 1\,\tfrac{\$}{L} \cdot x_2\,L \;\le\; 100\,\$'
    formula: 'p_1 x_1 + p_2 x_2 \le m'
  budget_line:
    en: The budget line is the boundary of that set, not the set itself.
    es: La línea presupuestaria es la frontera del conjunto, no el conjunto.
    formula: 'p_1 x_1 + p_2 x_2 = m'
  intercepts:
    en: Spend everything on one good and you get the intercepts.
    es: Gasta todo en un solo bien y obtienes los interceptos.
    formula: '\frac{m}{p_1} = \frac{100}{3} \approx 33.3 \qquad \frac{m}{p_2} = 100'
  slope:
    en: The slope is the relative price — what you give up of one good for one unit of the other.
    es: La pendiente es el precio relativo — a cuánto de un bien renuncias por una unidad del otro.
    # The slope's UNIT is readable here, not asserted: litres per kilo.
    formula_dim: '-\frac{p_1}{p_2} = -\frac{3\,\$/kg}{1\,\$/L} = -3\,\tfrac{L}{kg}'
    formula: 'x_2 = \frac{m}{p_2} - \frac{p_1}{p_2}\,x_1'
  income_shift:
    en: Income up ⇒ parallel shift. Prices did not change, so the slope did not either.
    es: Sube el ingreso ⇒ desplazamiento paralelo. Los precios no cambiaron, la pendiente tampoco.
    formula: 'm: 100 \to 150 \qquad \text{slope} = -3 \ \text{(unchanged)}'
  price_pivot:
    en: One price up ⇒ pivot. The other good's intercept stays put.
    es: Sube un precio ⇒ pivote. El intercepto del otro bien no se mueve.
    formula: 'p_1: 3 \to 4 \qquad \frac{m}{p_2} = 100 \ \text{(unchanged)}'
  recap:
    en: Income shifts the line; a price pivots it around the other intercept.
    es: El ingreso desplaza la línea; un precio la gira sobre el otro intercepto.
