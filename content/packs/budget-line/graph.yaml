# Qué hace la imagen en cada cue, como DATOS (decisión D-3).
#
# Este documento lo emite un modelo contra el esquema de `app/web/src/graph/script.ts`.
# Hasta hoy vivía como un `switch` en TypeScript, así que añadir un concepto exigía
# escribir código; eso es justo lo que hace caro el concepto número veinte.
#
# El vocabulario es cerrado a propósito —cinco capas, cuatro destacados, dos fantasmas,
# tres variables— y las expresiones son de una sola operación sobre el ejemplo base del
# pack. Lo que un modelo pueda escribir está en el esquema o es un error ruidoso. Un cue
# sin entrada no cambia nada, que es lo correcto para los que solo narran.
#
# Las expresiones se evalúan contra el ejemplo BASE y nunca contra el estado corriente:
# así dos `set` en distinto orden dan el mismo resultado y un modelo no puede romper la
# lección reordenando operaciones que parecen independientes.

version: 1

# Cues que narran sin tocar la imagen. Se declaran EXPLÍCITAMENTE: la compuerta
# `pipeline/check_cues.py` exige que cada cue de la timeline esté aquí o en `cues`, así
# que un cue que un modelo se saltó por descuido no puede pasar por deliberado.
narracion: [consumo, canasta]

cues:

  espacio:
    - mostrar: ejes

  budget_set:
    - mostrar: [linea, conjunto]

  budget_line:
    - mostrar: linea

  intercepts:
    - mostrar: interceptos

  slope:
    - mostrar: pendiente
    - destacar: pendiente

  # Desplazamiento paralelo: la recta anterior se queda de fantasma para que la
  # comparación sea una sola imagen y no dos gráficos superpuestos.
  income_shift:
    - fantasma: base
    - set: {m: m * 1.5}
    - destacar: ninguno

  # Pivote. El ingreso vuelve al base —venía multiplicado por el cue anterior— y sube p1.
  # Se destaca el intercepto que NO se mueve: esa es la lección entera.
  price_pivot:
    - set: {m: m}
    - fantasma: base
    - set: {p1: p1 + 1}
    - destacar: intercepto_x2

  recap:
    - fantasma: ninguno
    - set: {p1: p1, m: m}
    - destacar: ninguno


# La banda de la ecuación y las fichas de los bienes. Era el último `switch` de la
# lección: mientras estuviera en código, un pack generado podía dibujar su gráfico y no su
# ecuación, y la promesa de D-3 estaba a medias.
#
# La ecuación en sí NO va aquí: sale de `app/web/src/generated/formulas.ts`, que
# `pipeline/render_math.mjs` produce a partir del pack renderizando KaTeX en tiempo de
# compilación. Esto es solo qué se enciende, qué se destaca y qué se comprime.
#
# `destacar: []` apaga todo, y es deliberado en `budget_line`: ese momento es el morfismo
# de `<=` a `=`, y cualquier término encendido compite con él.
ledger:
  # El foco sigue a la narración (T-011 ronda 2). Solo se declara donde CAMBIA: un cue
  # sin `foco` hereda el anterior, igual que las capas.
  consumo:
    - foco: objeto
    - revelar: {bien: g1, estaciones: [glyph]}
    - revelar: {bien: g2, estaciones: [glyph]}

  canasta:
    - revelar: {bien: g1, estaciones: [unit]}
    - revelar: {bien: g2, estaciones: [unit]}
    - destacar: [x1, x2]

  espacio:
    - revelar: {bien: g1, estaciones: [symbol]}
    - revelar: {bien: g2, estaciones: [symbol]}
    - destacar: [x1, x2]

  # Aquí aparece el plano y pasa a ser el suceso.
  budget_set:
    - foco: grafico
    - revelar: {bien: g1, estaciones: [price]}
    - revelar: {bien: g2, estaciones: [price]}
    - destacar: [p1, p2, m]

  budget_line:
    - destacar: []

  intercepts:
    - destacar: [m, p1, p2]

  # Aquí empieza la compresión progresiva: el andamiaje encoge según se interioriza,
  # pero nunca desaparece.
  # La derivación es la idea nueva: la ecuación se reparte el sitio con el gráfico en vez
  # de quedarse aplastada en una cinta de cabecera.
  slope:
    - foco: algebra
    - destacar: [p1, p2]
    - comprimir: true

  # Explicada la razón, el álgebra se repliega y el plano vuelve a mandar.
  income_shift:
    - foco: grafico
    - destacar: [m]

  price_pivot:
    - precio: {bien: g1, valor: p1 + 1}
    - destacar: [p1]

  recap:
    - comprimir: false
    - precio: {bien: g1, valor: p1}
    - destacar: []
