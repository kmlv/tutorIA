# Banco de preguntas — línea presupuestaria
#
# Ninguna lleva nota (decisión 10 del brief). Existen para producir EVIDENCIA por
# sub-skill, no para calificar.
#
# `grader: deterministic` => lo corrige código. `grader: llm` => solo respuestas abiertas.
# Regla del PLAN §3.2 tras T-002: el juez LLM aporta como mucho 1 de las 3 evidencias
# necesarias para declarar dominio. Por eso el banco está deliberadamente cargado de
# ítems deterministas.
#
# `andamiaje: false` marca los ítems que pueden contar como el acierto SIN AYUDA que
# exige el criterio de dominio. Un ítem servido como remediación nunca cuenta.

pack: budget-line
version: 0.1.0

# Parámetros heredados de pack.yaml: p1=3, p2=1, m=100 (coffee / orange juice).
# Los enunciados los referencian como {{p1}}, {{p2}}, {{m}} para que cambiar el ejemplo
# en pack.yaml regenere el banco sin editar este archivo — criterio 2 del bake-off.

questions:

  # ---------------------------------------------------------------- BL.INT
  - id: q_int_numeric_1
    subskill_primary: BL.INT
    tier: 1
    modalidad: numeric
    grader: deterministic
    andamiaje: false
    enunciado:
      es: "Con ingreso {{m}} y precios p1={{p1}} y p2={{p2}}: si gastas todo en jugo, ¿cuántos litros compras?"
      en: "With income {{m}} and prices p1={{p1}}, p2={{p2}}: if you spend everything on juice, how many liters do you buy?"
    respuesta: {expr: "m / p2", tolerancia: 0.01}
    diagnostico_si_falla:
      "m / p1": BL-M6      # respondió el otro intercepto

  - id: q_int_numeric_2
    subskill_primary: BL.INT
    tier: 2
    modalidad: numeric
    grader: deterministic
    andamiaje: false
    enunciado:
      es: "¿Y si gastas todo en café? Redondea a un decimal."
      en: "And if you spend everything on coffee? Round to one decimal."
    respuesta: {expr: "m / p1", tolerancia: 0.05}
    diagnostico_si_falla:
      "m / p2": BL-M6

  - id: q_int_mcq
    subskill_primary: BL.INT
    tier: 2
    modalidad: mcq
    grader: deterministic
    andamiaje: false
    enunciado:
      es: "¿Cuál es el intercepto vertical de la línea presupuestaria?"
      en: "What is the vertical intercept of the budget line?"
    opciones:
      - {es: "m/p2", en: "m/p2", correcta: true}
      - {es: "m/p1", en: "m/p1", misconception: BL-M6}
      - {es: "-p1/p2", en: "-p1/p2", misconception: BL-M1}
      - {es: "m", en: "m", misconception: null}

  # ---------------------------------------------------------------- BL.SLOPE
  - id: q_slope_numeric
    subskill_primary: BL.SLOPE
    tier: 1
    modalidad: numeric
    grader: deterministic
    andamiaje: false
    enunciado:
      es: "¿Cuál es la pendiente de la línea presupuestaria? Incluye el signo."
      en: "What is the slope of the budget line? Include the sign."
    respuesta: {expr: "-p1 / p2", tolerancia: 0.01}
    diagnostico_si_falla:
      "-p2 / p1": BL-M1
      "p1 / p2": BL-M5
      "m / p2": BL-M1     # confunde pendiente con intercepto

  - id: q_slope_mcq
    subskill_primary: BL.SLOPE
    tier: 2
    modalidad: mcq
    grader: deterministic
    andamiaje: false
    enunciado:
      es: "La pendiente de la línea presupuestaria es:"
      en: "The slope of the budget line is:"
    opciones:
      - {es: "-p1/p2", en: "-p1/p2", correcta: true}
      - {es: "-p2/p1", en: "-p2/p1", misconception: BL-M1}
      - {es: "+p1/p2, porque ambos precios son positivos", en: "+p1/p2, because both prices are positive", misconception: BL-M5}
      - {es: "m/p2", en: "m/p2", misconception: BL-M6}

  - id: q_slope_open
    subskill_primary: BL.SLOPE
    subskills_secundarias: [BL.CS.P]
    tier: 3
    modalidad: open
    grader: llm
    andamiaje: false
    enunciado:
      es: "Explica con tus palabras qué significa que la pendiente sea {{slope}}. No uses la fórmula: dímelo en café y jugo."
      en: "Explain in your own words what a slope of {{slope}} means. Don't use the formula: tell me in coffee and juice."
    # FUSIONADO 2026-08-11 (Kristian). Antes eran tres puntos y dos de ellos pedían casi
    # lo mismo: `kp_tradeoff` (renunciar a N litros por un kilo) y `kp_relative_price`
    # (conectarlo con el precio relativo). Un alumno que dice "cada kilo de café me
    # cuesta tres litros de jugo" ya está diciendo las dos cosas, así que separarlas
    # obligaba al corrector a decidir si la segunda frase existía además de la primera.
    # En los datos se veía: era el punto de rúbrica con peor acuerdo de los seis, 76%,
    # y dos auditores lo señalaron por su cuenta. No era el juez — dos correctores
    # humanos tampoco habrían coincidido.
    key_points:
      - id: kp_tradeoff
        es: >-
          lee la pendiente como una tasa de intercambio: un kilo más de café cuesta
          {{slope_abs}} litros de jugo, o sea lo que cuesta el café medido en jugo
        en: >-
          reads the slope as an exchange rate: one more kilo of coffee costs
          {{slope_abs}} liters of juice — what coffee costs measured in juice
      - id: kp_sign
        es: el signo negativo refleja que un bien sube y el otro baja
        en: the negative sign reflects one good rising as the other falls
    misconceptions_vigilar: [BL-M1, BL-M5]

  # ---------------------------------------------------------------- BL.FEAS
  - id: q_feas_mcq
    subskill_primary: BL.FEAS
    tier: 1
    modalidad: mcq
    grader: deterministic
    andamiaje: false
    enunciado:
      es: "Compras 10 kg de café y 20 L de jugo. ¿Esa canasta es alcanzable?"
      en: "You buy 10 kg of coffee and 20 L of juice. Is that bundle affordable?"
    opciones:
      - {es: "Sí, gasta 50 y te sobran 50", en: "Yes, it costs 50 and leaves 50 over", correcta: true}
      - {es: "No, porque no agota el ingreso", en: "No, because it does not exhaust the income", misconception: BL-M4}
      - {es: "No, porque no está sobre la recta", en: "No, because it is not on the line", misconception: BL-M4}
      - {es: "Sí, y además es la mejor canasta posible", en: "Yes, and it is also the best possible bundle", misconception: BL-M7}

  - id: q_feas_manip
    subskill_primary: BL.FEAS
    tier: 2
    modalidad: manip
    grader: deterministic
    andamiaje: false
    enunciado:
      es: "Arrastra el punto hasta una canasta que puedas pagar SIN gastar todo tu ingreso."
      en: "Drag the point to a bundle you can afford WITHOUT spending your whole income."
    verificacion:
      tipo: region
      condicion: "p1*x1 + p2*x2 < m"
      margen: 2.0
    diagnostico_si_falla:
      sobre_la_recta: BL-M4

  - id: q_feas_open
    subskill_primary: BL.FEAS
    tier: 3
    modalidad: open
    grader: llm
    andamiaje: false
    enunciado:
      es: "¿Qué diferencia hay entre la línea presupuestaria y el conjunto presupuestario?"
      en: "What is the difference between the budget line and the budget set?"
    key_points:
      - id: kp_boundary
        es: la línea es la frontera del conjunto, no el conjunto entero
        en: the line is the boundary of the set, not the whole set
      - id: kp_interior
        es: el conjunto incluye canastas que no agotan el ingreso
        en: the set includes bundles that do not exhaust income
    misconceptions_vigilar: [BL-M4]

  # ---------------------------------------------------------------- BL.CS.M
  - id: q_cp1_income_direction
    subskill_primary: BL.CS.M
    tier: 1
    modalidad: mcq
    grader: deterministic
    andamiaje: false
    checkpoint: cp1
    enunciado:
      es: "Tu ingreso sube de {{m}} a 150. ¿Qué le pasa a la línea?"
      en: "Your income rises from {{m}} to 150. What happens to the line?"
    opciones:
      - {es: "Se desplaza hacia afuera, paralela", en: "It shifts outward, parallel", correcta: true}
      - {es: "Se vuelve más plana", en: "It becomes flatter", misconception: BL-M2}
      - {es: "Pivota sobre el intercepto de x2", en: "It pivots around the x2 intercept", misconception: BL-M2}
      - {es: "No cambia, porque los precios son los mismos", en: "It does not change, since prices are the same", misconception: null}

  - id: q_cs_m_manip
    subskill_primary: BL.CS.M
    tier: 2
    modalidad: manip
    grader: deterministic
    andamiaje: false
    enunciado:
      es: "El ingreso sube a 150. Mueve la recta a su nueva posición."
      en: "Income rises to 150. Move the line to its new position."
    verificacion:
      tipo: recta
      pendiente_esperada: "-p1/p2"
      tolerancia_pendiente: 0.10
      intercepto_x2_esperado: 150.0
      tolerancia_intercepto: 5.0
    diagnostico_si_falla:
      pendiente_cambio: BL-M2

  # ---------------------------------------------------------------- BL.CS.P
  - id: q_cs_p_mcq
    subskill_primary: BL.CS.P
    tier: 2
    modalidad: mcq
    grader: deterministic
    andamiaje: false
    enunciado:
      es: "El precio del café sube de {{p1}} a 4. ¿Qué le pasa a la línea?"
      en: "The price of coffee rises from {{p1}} to 4. What happens to the line?"
    opciones:
      - {es: "Pivota: el intercepto del jugo no se mueve y la recta se empina", en: "It pivots: the juice intercept stays and the line gets steeper", correcta: true}
      - {es: "Se desplaza hacia adentro, paralela", en: "It shifts inward, parallel", misconception: BL-M3}
      - {es: "Baja el intercepto vertical m/p2", en: "The vertical intercept m/p2 falls", misconception: BL-M3}
      - {es: "Se vuelve más plana", en: "It becomes flatter", misconception: BL-M1}

  - id: q_cs_p_manip
    subskill_primary: BL.CS.P
    tier: 3
    modalidad: manip
    grader: deterministic
    andamiaje: false
    enunciado:
      es: "El precio del café sube a 4. Mueve la recta."
      en: "The price of coffee rises to 4. Move the line."
    verificacion:
      tipo: recta
      pendiente_esperada: -4.0
      tolerancia_pendiente: 0.10
      intercepto_x2_esperado: "m / p2"
      tolerancia_intercepto: 3.0
    diagnostico_si_falla:
      intercepto_x2_cambio: BL-M3
      desplazamiento_paralelo: BL-M3

  - id: q_cp2_why_intercept_fixed
    subskill_primary: BL.CS.P
    subskills_secundarias: [BL.INT]
    tier: 3
    modalidad: open
    grader: llm
    andamiaje: false
    checkpoint: cp2
    enunciado:
      es: "¿Por qué el intercepto del jugo NO se mueve cuando sube el precio del café?"
      en: "Why does the juice intercept NOT move when the price of coffee rises?"
    key_points:
      - id: kp_intercept_formula
        es: ese intercepto es m/p2 y ni m ni p2 cambiaron
        en: that intercept is m/p2 and neither m nor p2 changed
      # Ojo: el intercepto del jugo es la esquina donde se gasta todo en JUGO. Decía
      # "café" en ambos idiomas, que es justo la afirmación contraria a la correcta;
      # como key_points es la rúbrica que ve el juez, esa línea habría hecho que el
      # juez premiara la confusión que la pregunta quiere detectar.
      - id: kp_corner_meaning
        es: gastar todo el ingreso en jugo no involucra al precio del café
        en: spending the whole income on juice does not involve the price of coffee
    misconceptions_vigilar: [BL-M3, BL-M2]

  # ---------------------------------------------------------------- BL.EQ
  # Solo dos ítems y ambos deterministas: BL.EQ es la sub-skill marcada como
  # `revisar_en_validacion` en pack.yaml por no tener misconception asociada.
  # Hasta que Kristian decida si se queda o se fusiona con BL.INT, no se le invierte
  # más banco.
  - id: q_eq_mcq
    subskill_primary: BL.EQ
    tier: 1
    modalidad: mcq
    grader: deterministic
    andamiaje: false
    enunciado:
      es: "¿Cuál de estas expresiones es la línea presupuestaria?"
      en: "Which of these is the budget line?"
    opciones:
      - {es: "p1·x1 + p2·x2 = m", en: "p1·x1 + p2·x2 = m", correcta: true}
      - {es: "p1·x1 + p2·x2 ≤ m", en: "p1·x1 + p2·x2 ≤ m", misconception: BL-M4}
      - {es: "x1/p1 + x2/p2 = m", en: "x1/p1 + x2/p2 = m", misconception: null}
      - {es: "p1·p2 = m", en: "p1·p2 = m", misconception: null}

  - id: q_eq_numeric
    subskill_primary: BL.EQ
    tier: 2
    modalidad: numeric
    grader: deterministic
    andamiaje: false
    enunciado:
      es: "Compras 12 kg de café. Si agotas tu ingreso, ¿cuántos litros de jugo compras?"
      en: "You buy 12 kg of coffee. If you exhaust your income, how many liters of juice do you buy?"
    respuesta: {expr: "(m - p1*12) / p2", tolerancia: 0.01}

  # Added after codex's T-005 review: the stricter reachability validator showed that
  # BL.EQ and BL.CS.M had only two primary items each, so three consecutive correct
  # answers were impossible. The bank claimed a mastery criterion it could not deliver.
  - id: q_eq_mcq_terms
    subskill_primary: BL.EQ
    tier: 2
    modalidad: mcq
    grader: deterministic
    andamiaje: false
    enunciado:
      es: "En p1·x1 + p2·x2 = m, ¿qué representa el término p1·x1?"
      en: "In p1·x1 + p2·x2 = m, what does the term p1·x1 represent?"
    opciones:
      - {es: "Lo que gastas en el bien 1", en: "What you spend on good 1", correcta: true}
      - {es: "Cuántas unidades del bien 1 compras", en: "How many units of good 1 you buy", misconception: null}
      - {es: "El precio relativo del bien 1", en: "The relative price of good 1", misconception: BL-M1}
      - {es: "Lo que te queda tras comprar el bien 1", en: "What is left after buying good 1", misconception: null}

  - id: q_cs_m_numeric
    subskill_primary: BL.CS.M
    tier: 2
    modalidad: numeric
    grader: deterministic
    andamiaje: false
    enunciado:
      es: "Tu ingreso sube de {{m}} a 150 y los precios no cambian. ¿Cuál es el nuevo intercepto vertical?"
      en: "Your income rises from {{m}} to 150 and prices do not change. What is the new vertical intercept?"
    respuesta: {expr: "150 / p2", tolerancia: 0.01}
    diagnostico_si_falla:
      "m / p2": BL-M2      # dejó el intercepto viejo: no vio que el ingreso lo mueve
      "150 / p1": BL-M6    # usó el eje equivocado

  # ---------------------------------------------------------------------------
  # PREDICTIONS. These fire from `<!--cue:predict:X-->` marks in the script, BEFORE the
  # narration reveals the answer. Kristian's instinct was to have the student confirm
  # "I understood" every few seconds; the instinct is right and the mechanism was wrong.
  # "I understood" is a self-report, and self-reports of comprehension are badly
  # calibrated — the student who clicks it most confidently is the one most at risk.
  # A prediction costs the same single tap but produces EVIDENCE, and predicting improves
  # learning even when the prediction is wrong, because it primes the student to notice
  # the gap between what they expected and what happens.
  # Each distractor maps to a catalogue misconception, so a wrong prediction is a
  # diagnosis rather than just a miss.
  # ---------------------------------------------------------------------------

  - id: q_predict_line_vs_set
    subskill_primary: BL.FEAS
    tier: 1
    modalidad: mcq
    grader: deterministic
    andamiaje: false
    prediction: true
    enunciado:
      es: "Antes de seguir: la región sombreada es el conjunto presupuestario. ¿Qué es entonces la recta que la bordea?"
      en: "Before we go on: the shaded region is the budget set. So what is the line that bounds it?"
    opciones:
      - {es: "Las canastas que gastan exactamente todo el ingreso", en: "The bundles that spend exactly all the income", correcta: true}
      - {es: "Las únicas canastas alcanzables", en: "The only affordable bundles", misconception: BL-M4}
      - {es: "Las canastas que no puedes pagar", en: "The bundles you cannot afford", misconception: BL-M4}

  - id: q_predict_slope_sign
    subskill_primary: BL.SLOPE
    tier: 1
    modalidad: mcq
    grader: deterministic
    andamiaje: false
    prediction: true
    enunciado:
      es: "Predice: para llevarte un kilo más de café, ¿a cuánto jugo tienes que renunciar?"
      en: "Predict: to take home one more kilo of coffee, how much juice do you give up?"
    opciones:
      - {es: "3 litros", en: "3 liters", correcta: true}
      - {es: "1 tercio de litro", en: "1 third of a liter", misconception: BL-M1}
      - {es: "A nada: puedo comprar más de los dos", en: "Nothing: I can buy more of both", misconception: BL-M5}

  - id: q_predict_price_effect
    subskill_primary: BL.CS.P
    tier: 2
    modalidad: mcq
    grader: deterministic
    andamiaje: false
    prediction: true
    enunciado:
      es: "Predice: ahora sube el precio del café. ¿Qué le pasa a la recta?"
      en: "Predict: now the price of coffee rises. What happens to the line?"
    opciones:
      - {es: "Gira: el intercepto del jugo no se mueve", en: "It pivots: the juice intercept stays put", correcta: true}
      - {es: "Se desplaza hacia adentro, paralela", en: "It shifts inward, parallel", misconception: BL-M3}
      - {es: "Gira, pero el que no se mueve es el intercepto del café", en: "It pivots, but the coffee intercept is the one that stays", misconception: BL-M3}
